# Gate de validação da migração e deploy de produção.
#
# Os jobs de validação executam exatamente os mesmos comandos documentados em
# docs/migration/VALIDATION_GATE.md. Eles não usam banco compartilhado nem
# segredo real: as credenciais abaixo são sintéticas e válidas apenas dentro
# do job. Só o job `deploy` usa segredo real, e só roda em push na main com
# todo o gate verde (docs/architecture/deploy-vm.md).
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Versões já estabelecidas no projeto (Dockerfiles dos apps e apps/evolution-go/go.mod).
  NODE_VERSION: "24.13.0"
  GO_VERSION: "1.25.0"

jobs:
  core:
    name: validate:core (linux)
    runs-on: ubuntu-latest
    env:
      # Sintéticos: os builds só geram clients/artefatos, nenhum passo do core
      # abre conexão com banco.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_build_only
      DIRECT_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_build_only
      BFF_BASE_URL: http://localhost:3002
      NEXT_PUBLIC_BFF_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/evolution-go/go.sum
      - name: Install package dependencies
        # Checkout limpo: nada de node_modules, dist ou código gerado vem do
        # Git. O client Prisma de cada app é produzido pelo próprio
        # `npm run build`, que roda antes das suítes dentro de validate:core.
        run: |
          for dir in apps/scheduling-service apps/ai-orchestrator apps/bff apps/frontend; do
            npm ci --prefix "$dir"
          done
      - name: npm run validate:core
        run: npm run validate:core

  go-windows:
    name: evolution-go (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/evolution-go/go.sum
      - name: go build
        working-directory: apps/evolution-go
        run: go build ./...
      - name: go vet
        working-directory: apps/evolution-go
        run: go vet ./...
      - name: go test
        working-directory: apps/evolution-go
        run: go test -count=1 ./...
      - name: repeated cleanup fixtures
        # Reproduz no Windows a classe de falha corrigida pelo Goal002:
        # arquivo de log aberto impedindo a remoção do t.TempDir().
        working-directory: apps/evolution-go
        run: go test -count=5 ./pkg/instance/service ./pkg/events/webhook

  integration:
    name: validate:integration (linux)
    runs-on: ubuntu-latest
    env:
      BFF_TEST_DATABASE_URL: postgresql://bff_test:bff_test_synthetic_password@127.0.0.1:5432/avenly_bff_test
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL 16 on the runner (loopback)
        # Banco descartável do job; morre junto com o runner. PostgreSQL nativo
        # do runner, e não container de serviço: no container o servidor se vê
        # pelo IP da bridge do Docker (172.x), e a trava das suítes de
        # integração (`assertDisposableTarget`, `inet_server_addr()` loopback)
        # recusa com razão. Aqui o servidor escuta em 127.0.0.1 de fato.
        # pgvector é obrigatório: `CREATE EXTENSION vector` — que o histórico da
        # IA exige desde `20260829180000_rag_pgvector` — só funciona com a
        # biblioteca instalada no servidor. Sem ela o passo
        # `rehearse:goal028-release-migrations` recusa com exit 2.
        # Superusuário como o POSTGRES_USER do container anterior: os ensaios
        # criam bancos próprios e instalam extensão.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-pgvector
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE bff_test LOGIN SUPERUSER PASSWORD 'bff_test_synthetic_password'" \
            -c "CREATE DATABASE avenly_bff_test OWNER bff_test"
          pg_isready -h 127.0.0.1 -p 5432
          PGPASSWORD=bff_test_synthetic_password psql -h 127.0.0.1 -U bff_test -d avenly_bff_test -tAc \
            "SELECT host(inet_server_addr()), current_setting('server_version')"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install BFF dependencies
        # Única preparação fora do gate. A geração do client Prisma é o
        # primeiro passo de validate:integration, e não depende de nenhum
        # artefato produzido por outro job ou por execução local anterior.
        run: npm ci --prefix apps/bff
      - name: Assert no generated Prisma client is committed
        run: |
          if [ -e apps/bff/src/generated/prisma ]; then
            echo "apps/bff/src/generated/prisma must not come from the checkout"
            exit 1
          fi
      - name: Assert PostgreSQL client tools are present and not older than the server
        # `rehearse:goal028-restore` recusa com exit 2 sem `pg_dump`/`pg_restore`
        # no PATH, e um cliente mais antigo que o servidor recusa o dump. A
        # imagem do runner já traz o cliente 16; este passo falha cedo e com
        # mensagem própria caso isso mude, em vez de virar um exit 2 opaco.
        run: |
          pg_dump --version
          pg_restore --version
          major=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          if [ "$major" -lt 16 ]; then
            echo "pg_dump $major is older than the PostgreSQL 16 service; install postgresql-client-16"
            exit 1
          fi
      - name: npm run validate:integration
        run: npm run validate:integration
      - name: Refuses to run without an explicit test database
        # O gate precisa recusar, não pular, quando a URL de teste some.
        run: |
          set +e
          npm run validate:integration
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected refusal exit code 2, got $status"
            exit 1
          fi
        env:
          BFF_TEST_DATABASE_URL: ""

  deploy:
    name: deploy (production)
    # Só push na main, e só depois de todo o gate verde: PR e
    # workflow_dispatch nunca publicam. DEPLOY_ENABLED (variável do
    # repositório) mantém o job pulado até a VM existir; ligado, segredo
    # ausente falha alto em vez de pular calado.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: [core, go-windows, integration]
    runs-on: ubuntu-latest
    environment: production
    # Um deploy por vez; um push novo espera o anterior em vez de cancelá-lo
    # no meio de uma migração.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::error::COOLIFY_DEPLOY_WEBHOOK and COOLIFY_API_TOKEN must be set when DEPLOY_ENABLED is true"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_DEPLOY_WEBHOOK"
