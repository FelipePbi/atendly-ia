services:
  ai-orchestrator:
    build: .
    command: sh -c "npx prisma migrate deploy && npm start"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AI_ORCHESTRATOR_PORT: ${AI_ORCHESTRATOR_PORT:-3000}
      DATABASE_URL: postgresql://${AI_ORCHESTRATOR_POSTGRES_USER:-app}:${AI_ORCHESTRATOR_POSTGRES_PASSWORD:-app}@ai-orchestrator-postgres:5432/${AI_ORCHESTRATOR_POSTGRES_DB:-ai_orchestrator}?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-600}
      KNOWLEDGE_SEARCH_LIMIT: ${KNOWLEDGE_SEARCH_LIMIT:-4}
      KNOWLEDGE_SEARCH_MIN_SCORE: ${KNOWLEDGE_SEARCH_MIN_SCORE:-0.65}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-troque-este-token}
      EVOLUTION_BASE_URL: http://evolution-go:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave-global}
      EVOLUTION_SEND_TEXT_PATH: ${EVOLUTION_SEND_TEXT_PATH:-/send/text}
      EVOLUTION_IGNORE_GROUPS: ${EVOLUTION_IGNORE_GROUPS:-true}
      EVOLUTION_BOT_ENABLED: ${EVOLUTION_BOT_ENABLED:-true}
      EVOLUTION_ALLOW_SELF_CHAT: ${EVOLUTION_ALLOW_SELF_CHAT:-false}
      HUMAN_HANDOFF_PAUSE_MINUTES: ${HUMAN_HANDOFF_PAUSE_MINUTES:-120}
      SCHEDULING_SERVICE_BASE_URL: ${SCHEDULING_SERVICE_BASE_URL:-http://host.docker.internal:3003}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AI_ORCHESTRATOR_PORT:-3000}:3000"
    depends_on:
      ai-orchestrator-postgres:
        condition: service_healthy
      evolution-go:
        condition: service_started
    restart: unless-stopped

  ai-orchestrator-postgres:
    image: pgvector/pgvector:0.8.6-pg15-bookworm
    environment:
      POSTGRES_USER: ${AI_ORCHESTRATOR_POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${AI_ORCHESTRATOR_POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${AI_ORCHESTRATOR_POSTGRES_DB:-ai_orchestrator}
    ports:
      - "5433:5432"
    volumes:
      - ai_orchestrator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AI_ORCHESTRATOR_POSTGRES_USER:-app} -d ${AI_ORCHESTRATOR_POSTGRES_DB:-ai_orchestrator}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  evogo-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${EVOGO_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${EVOGO_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      EVOGO_AUTH_DB: ${EVOGO_AUTH_DB:-evogo_auth}
      EVOGO_USERS_DB: ${EVOGO_USERS_DB:-evogo_users}
    ports:
      - "5434:5432"
    volumes:
      - evogo_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/evolution-init.sql:/docker-entrypoint-initdb.d/01-evolution-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${EVOGO_POSTGRES_USER:-postgres} -d postgres",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  evolution-go:
    image: evoapicloud/evolution-go:latest
    build:
      context: ../evolution-go
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave-global}
      POSTGRES_AUTH_DB: postgresql://${EVOGO_POSTGRES_USER:-postgres}:${EVOGO_POSTGRES_PASSWORD:-postgres}@evogo-postgres:5432/${EVOGO_AUTH_DB:-evogo_auth}?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${EVOGO_POSTGRES_USER:-postgres}:${EVOGO_POSTGRES_PASSWORD:-postgres}@evogo-postgres:5432/${EVOGO_USERS_DB:-evogo_users}?sslmode=disable
      DATABASE_SAVE_MESSAGES: ${EVOGO_DATABASE_SAVE_MESSAGES:-false}
      WADEBUG: ${EVOGO_WADEBUG:-INFO}
      LOGTYPE: ${EVOGO_LOGTYPE:-console}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      evogo-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ai_orchestrator_postgres_data:
  evogo_postgres_data:
