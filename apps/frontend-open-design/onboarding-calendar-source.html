<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Escolha sua agenda — Atendly</title><link rel="stylesheet" href="atendly.css"></head>
<body class="onboarding-page">
  <main class="onboarding-shell" data-od-id="onboarding-calendar-source">
    <header class="onboarding-topbar"><a class="brand" href="index.html"><span class="brand-mark"></span><span>Atendly</span></a><div class="step-progress"><div class="step-progress-row"><span>Etapa 2 de 8</span><span>Agenda</span></div><div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="8" aria-valuenow="2"><div class="progress-bar" style="width:25%"></div></div></div><a class="onboarding-exit" href="index.html">Sair</a></header>
    <section class="onboarding-main"><div class="onboarding-content">
      <header class="onboarding-heading"><p class="eyebrow">Fonte oficial</p><h1 data-od-id="calendar-source-title">Onde seus agendamentos serão controlados?</h1><p>Você terá uma única fonte oficial. Essa escolha evita horários duplicados.</p></header>
      <div class="choice-grid" role="radiogroup" aria-label="Fonte oficial da agenda">
        <button class="choice-card source-card" type="button" role="radio" aria-checked="false" data-onboarding-choice data-source="atendly" data-next="onboarding-atendly-confirm.html" data-od-id="choose-atendly"><span class="choice-check"><svg class="icon"><use href="atendly-icons.svg#i-check"></use></svg></span><svg class="icon"><use href="atendly-icons.svg#i-calendar"></use></svg><h3>Agenda Atendly</h3><p>Atendly controla serviços, horários e agendamentos.</p></button>
        <button class="choice-card source-card" type="button" role="radio" aria-checked="false" data-onboarding-choice data-source="external" data-next="onboarding-external-intro.html" data-od-id="choose-external"><span class="choice-check"><svg class="icon"><use href="atendly-icons.svg#i-check"></use></svg></span><svg class="icon"><use href="atendly-icons.svg#i-refresh"></use></svg><h3>Minha Agenda</h3><p>Minha Agenda continua controlando seus agendamentos.</p></button>
      </div>
      <div class="onboarding-actions"><a class="btn btn-secondary" href="onboarding-business.html">Voltar</a><a class="btn btn-primary is-disabled" href="#" aria-disabled="true" data-choice-next>Usar esta agenda</a></div>
    </div></section>
  </main>
  <script src="atendly.js"></script><script src="atendly-onboarding.js"></script>
</body></html>
