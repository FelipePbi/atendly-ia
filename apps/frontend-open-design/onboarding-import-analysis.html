<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Analisando dados — Atendly</title>
  <link rel="stylesheet" href="atendly.css">
</head>
<body class="onboarding-page">
  <main class="onboarding-shell" data-od-id="onboarding-import-analysis">
    <header class="onboarding-topbar">
      <a class="brand" href="index.html"><span class="brand-mark"></span><span>Atendly</span></a>
      <div class="step-progress"><div class="step-progress-row"><span>Importação · 2 de 6</span><span>Análise</span></div><div class="progress-track"><div class="progress-bar" style="width:33.3%"></div></div></div>
      <a class="onboarding-exit" href="index.html">Sair</a>
    </header>
    <section class="onboarding-main">
      <div class="onboarding-content">
        <header class="onboarding-heading"><p class="eyebrow">Verificando origem</p><h1 data-od-id="analysis-title">Analisando os dados encontrados</h1><p>Antes de copiar qualquer coisa, a Atendly verifica o que pode ser importado.</p></header>
        <div class="analysis-panel" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><h3>Preparando uma prévia</h3><p>Nenhum dado foi alterado. Aguarde a análise terminar.</p></div>
        <div class="onboarding-actions"><a class="btn btn-secondary" href="onboarding-import-connect.html">Cancelar</a><a class="btn btn-primary" href="onboarding-import-preview.html">Ver prévia</a></div>
      </div>
    </section>
  </main>
  <script src="atendly-onboarding.js"></script>
</body>
</html>
