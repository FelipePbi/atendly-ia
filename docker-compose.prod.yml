# Produção em uma VM única (Coolify ou `docker compose` puro).
#
# Público: só frontend (APP_URL) e bff (API_URL). IA, agenda, Evolution e
# Postgres ficam na rede interna do compose e se enxergam pelo nome do serviço.
# No Coolify, os domínios são atribuídos na UI a `frontend` (porta 3001) e a
# `bff` (porta 3002). Variáveis: `.env.production.example`.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-node-healthcheck: &node-healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  postgres:
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      BFF_DB_PASSWORD: ${BFF_DB_PASSWORD:?}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?}
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD:?}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  evolution-go:
    build:
      context: ./apps/evolution-go
    environment:
      SERVER_PORT: 8080
      EVOLUTION_ENV: production
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:?}
      POSTGRES_AUTH_DB: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "true"
      WADEBUG: INFO
      LOGTYPE: console
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      <<: *node-healthcheck
    restart: unless-stopped
    logging: *logging

  scheduling-service:
    build:
      context: ./apps/scheduling-service
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://scheduling:${SCHEDULING_DB_PASSWORD}@postgres:5432/avenly_scheduling?sslmode=disable
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:?}
      MINHA_AGENDA_OAUTH_CLIENT_CREDENTIAL: ${MINHA_AGENDA_OAUTH_CLIENT_CREDENTIAL:-}
      # Ciclo de vida do atendimento confirmado: explícito, não default.
      CALENDAR_AUTO_COMPLETE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      <<: *node-healthcheck
    restart: unless-stopped
    logging: *logging

  ai-orchestrator:
    build:
      context: ./apps/ai-orchestrator
    environment:
      NODE_ENV: production
      AI_ORCHESTRATOR_PORT: 3000
      DATABASE_URL: postgresql://ai_orchestrator:${AI_DB_PASSWORD}@postgres:5432/avenly_ai?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      EVOLUTION_BASE_URL: http://evolution-go:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_SECRET:?}
      SCHEDULING_SERVICE_BASE_URL: http://scheduling-service:3003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CHANNEL_CREDENTIAL_KEYS: ${CHANNEL_CREDENTIAL_KEYS:?}
      CHANNEL_CREDENTIAL_ACTIVE_KEY_ID: ${CHANNEL_CREDENTIAL_ACTIVE_KEY_ID:?}
      PLATFORM_WHATSAPP_INSTANCE_ID: ${PLATFORM_WHATSAPP_INSTANCE_ID:-}
      PLATFORM_WHATSAPP_CREDENTIAL: ${PLATFORM_WHATSAPP_CREDENTIAL:-}
      PLATFORM_WHATSAPP_NUMBER: ${PLATFORM_WHATSAPP_NUMBER:-}
      # Vazia, a IA responde todo contato. Com números (dígitos com DDI,
      # separados por vírgula), só eles recebem resposta.
      AI_REPLY_ONLY_PHONES: ${AI_REPLY_ONLY_PHONES:-}
      # Caminho de mensagem e de lembrete: explícitos, não default.
      INBOX_WORKER_ENABLED: "true"
      NOTIFICATION_DELIVERY_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      scheduling-service:
        condition: service_started
      evolution-go:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      <<: *node-healthcheck
    restart: unless-stopped
    logging: *logging

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://bff:${BFF_DB_PASSWORD}@postgres:5432/avenly_bff?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?}
      FRONTEND_ORIGIN: ${APP_URL:?}
      # Um proxy reverso (Traefik do Coolify) na frente: o IP real do usuário
      # vem de X-Forwarded-For, e cada usuário tem o próprio balde de rate limit.
      TRUST_PROXY_HOPS: 1
      COOKIE_SECURE: "true"
      # app.<domínio> e api.<domínio> são same-site: lax basta. Use "none"
      # só se frontend e API ficarem em domínios registráveis diferentes.
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      AI_ORCHESTRATOR_BASE_URL: http://ai-orchestrator:3000
      SCHEDULING_SERVICE_BASE_URL: http://scheduling-service:3003
      EVOLUTION_GO_BASE_URL: http://evolution-go:8080
      EVOLUTION_GO_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      WHATSAPP_CREDENTIAL_KEYS: ${WHATSAPP_CREDENTIAL_KEYS:?}
      WHATSAPP_CREDENTIAL_ACTIVE_KEY_ID: ${WHATSAPP_CREDENTIAL_ACTIVE_KEY_ID:?}
      PASSWORD_RESET_PUBLIC_URL: ${APP_URL}/nova-senha
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Purga é destrutiva: desligadas até a operação decidir ligar.
      RETENTION_SWEEP_ENABLED: "false"
      ACCOUNT_PURGE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      ai-orchestrator:
        condition: service_started
      scheduling-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      <<: *node-healthcheck
    restart: unless-stopped
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Embutida no build: o navegador chama o BFF pelo domínio público.
        NEXT_PUBLIC_BFF_URL: ${API_URL:?}
        BFF_BASE_URL: http://bff:3002
        AVENLY_LEGAL_NAME: ${AVENLY_LEGAL_NAME:-}
        AVENLY_TRADE_NAME: ${AVENLY_TRADE_NAME:-}
        AVENLY_CNPJ: ${AVENLY_CNPJ:-}
        AVENLY_LEGAL_ADDRESS: ${AVENLY_LEGAL_ADDRESS:-}
        AVENLY_SUPPORT_EMAIL: ${AVENLY_SUPPORT_EMAIL:-}
        AVENLY_PRIVACY_EMAIL: ${AVENLY_PRIVACY_EMAIL:-}
        AVENLY_PRIVACY_OFFICER: ${AVENLY_PRIVACY_OFFICER:-}
        AVENLY_AI_PROVIDER: ${AVENLY_AI_PROVIDER:-}
        AVENLY_HOSTING_PROVIDER: ${AVENLY_HOSTING_PROVIDER:-}
        AVENLY_ANALYTICS_PROVIDERS: ${AVENLY_ANALYTICS_PROVIDERS:-}
        AVENLY_RETENTION_PERIOD: ${AVENLY_RETENTION_PERIOD:-}
        AVENLY_APPLICABLE_FORUM: ${AVENLY_APPLICABLE_FORUM:-}
        AVENLY_LEGAL_REVIEW_APPROVED: ${AVENLY_LEGAL_REVIEW_APPROVED:-false}
        AVENLY_LEGAL_INDEXABLE: ${AVENLY_LEGAL_INDEXABLE:-false}
    environment:
      PORT: 3001
    depends_on:
      bff:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      <<: *node-healthcheck
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
