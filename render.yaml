services:
  - type: web
    name: atendly-ia-frontend
    runtime: node
    plan: free
    rootDir: apps/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/frontend/**
        - packages/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NEXT_PUBLIC_BFF_URL
        value: https://atendly-ia-bff.onrender.com
      - key: BFF_BASE_URL
        value: https://atendly-ia-bff.onrender.com

  - type: web
    name: atendly-ia-bff
    runtime: node
    plan: free
    rootDir: apps/bff
    buildCommand: npm ci && npm run prisma:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/bff/**
        - packages/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://atendly-ia-frontend.onrender.com
      - key: COOKIE_SECURE
        value: true
      # Varredura de retencao e purga de conta (Goal023/Goal025): explicitas
      # aqui, ligado/desligado em producao nao pode ser efeito colateral do
      # default do schema. Desligadas ate a operacao decidir ligar: purga e
      # destrutiva, e nenhuma rota, leitura ou tela depende do laco.
      - key: RETENTION_SWEEP_ENABLED
        value: false
      - key: ACCOUNT_PURGE_ENABLED
        value: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: AI_ORCHESTRATOR_BASE_URL
        value: https://atendimeto-ia.onrender.com
      - key: SCHEDULING_SERVICE_BASE_URL
        value: https://atendly-ia-scheduling-service.onrender.com
      - key: EVOLUTION_GO_BASE_URL
        value: https://evolution-go-4pmo.onrender.com
      - key: EVOLUTION_GO_API_KEY
        fromService:
          type: web
          name: atendly-ia-evolution-go
          envVarKey: GLOBAL_API_KEY
      - key: EVOLUTION_WEBHOOK_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: atendly-ia-ai-orchestrator
          envVarKey: INTERNAL_SERVICE_TOKEN
      # Cifra da credencial da instancia WhatsApp. Formato exigido:
      # "<keyId>:<chave base64 de exatamente 32 bytes>", separadas por virgula.
      # Nao usar generateValue: o valor precisa decodificar em 32 bytes.
      - key: WHATSAPP_CREDENTIAL_KEYS
        sync: false
      - key: WHATSAPP_CREDENTIAL_ACTIVE_KEY_ID
        sync: false
      # Recuperacao de senha. Delivery URL/token recebem o disparo do envio; a
      # URL publica precisa apontar para o dominio real do frontend, nunca
      # para o host de desenvolvimento.
      - key: PASSWORD_RESET_PUBLIC_URL
        value: https://atendly-ia-frontend.onrender.com/nova-senha
      - key: PASSWORD_RESET_DELIVERY_URL
        sync: false
      - key: PASSWORD_RESET_DELIVERY_TOKEN
        sync: false

  - type: web
    name: atendly-ia-ai-orchestrator
    runtime: node
    plan: free
    rootDir: apps/ai-orchestrator
    buildCommand: npm ci && npm run prisma:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/ai-orchestrator/**
        - packages/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_TOKEN
        fromService:
          type: web
          name: atendly-ia-bff
          envVarKey: EVOLUTION_WEBHOOK_SECRET
      - key: EVOLUTION_BASE_URL
        value: https://evolution-go-4pmo.onrender.com
      - key: EVOLUTION_API_KEY
        fromService:
          type: web
          name: atendly-ia-evolution-go
          envVarKey: GLOBAL_API_KEY
      # Cifra da projecao da credencial de instancia recebida do BFF. Material
      # proprio da IA, mesmo formato de "<keyId>:<base64 de 32 bytes>".
      - key: CHANNEL_CREDENTIAL_KEYS
        sync: false
      - key: CHANNEL_CREDENTIAL_ACTIVE_KEY_ID
        sync: false
      - key: SCHEDULING_SERVICE_BASE_URL
        value: https://atendly-ia-scheduling-service.onrender.com
      # Numero oficial da Avenly usado no teste real da IA (Goal019).
      # Configuracao do servico, nunca vinculo de negocio; nao vira linha de
      # ChannelConnection nem aparece em listagem de conexoes de tenant.
      - key: PLATFORM_WHATSAPP_INSTANCE_ID
        sync: false
      - key: PLATFORM_WHATSAPP_CREDENTIAL
        sync: false
      - key: PLATFORM_WHATSAPP_NUMBER
        sync: false
      # Inbox duravel e entrega de intencoes (Goal013/Goal021): explicitas
      # aqui, ligado/desligado em producao nao pode ser efeito colateral do
      # default do schema. Ligadas porque sao o proprio caminho de mensagem e
      # de lembrete, nao uma varredura destrutiva opcional.
      - key: INBOX_WORKER_ENABLED
        value: true
      - key: NOTIFICATION_DELIVERY_ENABLED
        value: true

  - type: web
    name: atendly-ia-scheduling-service
    runtime: node
    plan: free
    rootDir: apps/scheduling-service
    buildCommand: npm ci && npm run prisma:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/scheduling-service/**
        - packages/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        fromDatabase:
          name: atendly-ia-scheduling-db
          property: connectionString
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: atendly-ia-ai-orchestrator
          envVarKey: INTERNAL_SERVICE_TOKEN
      - key: INTEGRATION_CREDENTIALS_KEY
        generateValue: true
      # Origem Minha Agenda (Goal060 §1): endereco publico, igual para todo
      # ambiente, e cliente OAuth do portal, segredo unico por ambiente.
      - key: MINHA_AGENDA_API_BASE_URL
        value: https://api.minhaagendaapp.com.br
      - key: MINHA_AGENDA_OAUTH_CLIENT_CREDENTIAL
        sync: false
      # Conclusao automatica de atendimentos (Goal008): explicita aqui,
      # ligado/desligado em producao nao pode ser efeito colateral do default
      # do schema. Ligada porque e o proprio ciclo de vida do atendimento
      # confirmado, nao uma varredura destrutiva opcional.
      - key: CALENDAR_AUTO_COMPLETE_ENABLED
        value: true

  - type: web
    name: atendly-ia-evolution-go
    runtime: docker
    plan: free
    rootDir: apps/evolution-go
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/evolution-go/**
        - render.yaml
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: POSTGRES_AUTH_DB
        sync: false
      - key: POSTGRES_USERS_DB
        sync: false
      - key: GLOBAL_API_KEY
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false

  - type: web
    name: atendly-ia-health-worker
    runtime: node
    plan: free
    rootDir: apps/health-worker
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/health-worker/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: FRONTEND_BASE_URL
        value: https://atendly-ia-frontend.onrender.com
      - key: BFF_BASE_URL
        value: https://atendly-ia-bff.onrender.com
      - key: AI_ORCHESTRATOR_BASE_URL
        value: https://atendimeto-ia.onrender.com
      - key: SCHEDULING_SERVICE_BASE_URL
        value: https://atendly-ia-scheduling-service.onrender.com
      - key: EVOLUTION_GO_BASE_URL
        value: https://evolution-go-4pmo.onrender.com

databases:
  - name: atendly-ia-scheduling-db
    plan: free
    region: oregon
    databaseName: atendly_scheduling
    user: atendly_scheduling
