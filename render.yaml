services:
  - type: web
    name: atendly-ia-frontend
    runtime: node
    plan: free
    rootDir: apps/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/frontend/**
        - packages/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NEXT_PUBLIC_BFF_URL
        value: https://atendly-ia-bff.onrender.com
      - key: BFF_BASE_URL
        value: https://atendly-ia-bff.onrender.com

  - type: web
    name: atendly-ia-bff
    runtime: node
    plan: free
    rootDir: apps/bff
    buildCommand: npm ci && npm run prisma:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/bff/**
        - packages/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://atendly-ia-frontend.onrender.com
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      - key: AI_ORCHESTRATOR_BASE_URL
        value: https://atendimeto-ia.onrender.com
      - key: SCHEDULING_SERVICE_BASE_URL
        value: https://atendly-ia-scheduling-service.onrender.com
      - key: EVOLUTION_GO_BASE_URL
        value: https://evolution-go-4pmo.onrender.com
      - key: EVOLUTION_GO_API_KEY
        fromService:
          type: web
          name: atendly-ia-evolution-go
          envVarKey: GLOBAL_API_KEY
      - key: EVOLUTION_WEBHOOK_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: atendly-ia-ai-orchestrator
          envVarKey: INTERNAL_SERVICE_TOKEN

  - type: web
    name: atendly-ia-ai-orchestrator
    runtime: node
    plan: free
    rootDir: apps/ai-orchestrator
    buildCommand: npm ci && npm run prisma:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/ai-orchestrator/**
        - packages/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_TOKEN
        fromService:
          type: web
          name: atendly-ia-bff
          envVarKey: EVOLUTION_WEBHOOK_SECRET
      - key: EVOLUTION_BASE_URL
        value: https://evolution-go-4pmo.onrender.com
      - key: EVOLUTION_API_KEY
        fromService:
          type: web
          name: atendly-ia-evolution-go
          envVarKey: GLOBAL_API_KEY
      - key: SCHEDULING_SERVICE_BASE_URL
        value: https://atendly-ia-scheduling-service.onrender.com

  - type: web
    name: atendly-ia-scheduling-service
    runtime: node
    plan: free
    rootDir: apps/scheduling-service
    buildCommand: npm ci && npm run prisma:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/scheduling-service/**
        - packages/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        fromDatabase:
          name: atendly-ia-scheduling-db
          property: connectionString
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: atendly-ia-ai-orchestrator
          envVarKey: INTERNAL_SERVICE_TOKEN
      - key: INTEGRATION_CREDENTIALS_KEY
        generateValue: true

  - type: web
    name: atendly-ia-evolution-go
    runtime: docker
    plan: free
    rootDir: apps/evolution-go
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/evolution-go/**
        - render.yaml
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: POSTGRES_AUTH_DB
        sync: false
      - key: POSTGRES_USERS_DB
        sync: false
      - key: GLOBAL_API_KEY
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false

  - type: web
    name: atendly-ia-health-worker
    runtime: node
    plan: free
    rootDir: apps/health-worker
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/health-worker/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: FRONTEND_BASE_URL
        value: https://atendly-ia-frontend.onrender.com
      - key: BFF_BASE_URL
        value: https://atendly-ia-bff.onrender.com
      - key: AI_ORCHESTRATOR_BASE_URL
        value: https://atendimeto-ia.onrender.com
      - key: SCHEDULING_SERVICE_BASE_URL
        value: https://atendly-ia-scheduling-service.onrender.com
      - key: EVOLUTION_GO_BASE_URL
        value: https://evolution-go-4pmo.onrender.com

databases:
  - name: atendly-ia-scheduling-db
    plan: free
    region: oregon
    databaseName: atendly_scheduling
    user: atendly_scheduling
